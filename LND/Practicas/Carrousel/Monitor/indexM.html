<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusel de Productos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="carousel-container">
        <div class="product-header">
            <h1 class="product-name"></h1>
        </div>
        
        <div class="image-section">
            <p class="image-label">imagen</p>
            <div class="image-display">
                <!-- Aquí van las imágenes del producto -->
            </div>
        </div>
        
        <div class="carousel-controls">
            <button class="nav-btn prev-btn" aria-label="Anterior">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </button>
            
            <div class="indicators">
                <span class="indicator active"></span>
                <span class="indicator"></span>
                <span class="indicator"></span>
                <span class="indicator"></span>
                <span class="indicator"></span>
                <span class="indicator"></span>
                <span class="indicator"></span>
            </div>
            
            <button class="nav-btn next-btn" aria-label="Siguiente">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 18l6-6-6-6"/>
                </svg>
            </button>
        </div>
        
        <div class="text-section">
            <p class="text-label">texto</p>
            <div class="text-content">
                <!-- Aquí va la descripción del producto -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
