<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Examen: Simón Dice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <h1>Simón Dice</h1>
        <p>Nivel: <span id="nivel">0</span></p>
        
        <div class="tablero">
            <div id="verde" class="boton-juego verde" data-color="verde"></div>
            <div id="rojo" class="boton-juego rojo" data-color="rojo"></div>
            <div id="amarillo" class="boton-juego amarillo" data-color="amarillo"></div>
            <div id="azul" class="boton-juego azul" data-color="azul"></div>
        </div>

        <button id="btn-inicio" class="btn-start">Comenzar</button>
        <p id="mensaje-estado"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
