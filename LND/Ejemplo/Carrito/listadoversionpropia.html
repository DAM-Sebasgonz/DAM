<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compra</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Tienda Online</h1>
        
        <div class="productos">
            <div class="producto">
                <h3>Monitor</h3>
                <p>€299.99</p>
                <button onclick="agregarAlCarrito('Monitor', 299.99)">Agregar al carrito</button>
            </div>
            
            <div class="producto">
                <h3>Ratón</h3>
                <p>€29.99</p>
                <button onclick="agregarAlCarrito('Ratón', 29.99)">Agregar al carrito</button>
            </div>
            
            <div class="producto">
                <h3>Teclado</h3>
                <p>€79.99</p>
                <button onclick="agregarAlCarrito('Teclado', 79.99)">Agregar al carrito</button>
            </div>
        </div>

        <br>

        <div class="carrito-section">
            <h2>Tu Carrito</h2>
            <div id="lista-carrito">
                <p class="carrito-vacio">El carrito está vacío</p>
            </div>
            <div class="total" id="total">Total: €0.00</div>
        </div>
    </div>

    <script src="scriptversionpropia.js"></script>
</body>
</html>
